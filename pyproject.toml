[project]
name = "anchor-rag"
version = "1.0.0"
description = "Question answering over four anchor papers and the papers that cite them."
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "artifacts", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
